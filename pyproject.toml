[project]
name = "cua-smoketest"
version = "0.1.0"
description = "Local FreeCAD GUI smoketest harness for EC2 (Blender installed but not exercised)."
requires-python = ">=3.10"
dependencies = [
    "pyautogui>=0.9.54",
    "pillow>=10.0.0",
    "pygetwindow>=0.0.9 ; sys_platform != 'linux'",
    "python-xlib>=0.33",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
cua-smoketest = "cua_smoketest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cua_smoketest"]
